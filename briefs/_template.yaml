# A brief: which data, what you want to know, and the context.
#
# 1. Copy this file, e.g. to briefs/my_data.yaml, and fill in the three parts below.
# 2. Run everything (cleaning, analysis, report) in one go:
#      uv run python -m pipeline.run briefs/my_data.yaml
# 3. Open the REPORT.pdf it points to at the end.

# 1. The dataset: the file in data/raw/ to analyse.
data_file: data/raw/my_data.csv

# 2. The question you want answered. Be specific: this steers the whole analysis.
goal: >
  Which ... are associated with ...?

# 3. The context: what one row is, where the data comes from, units.
description: >
  One row per ... from ... Amounts are in ...


# --- Optional extras: remove the # in front of a line to use it ----------------------

# The report's title (default: from the file name).
# title: What drives customer churn?

# The column that is the answer to your question (a yes/no or a number).
# target: my_outcome_column

# The ID column, if there is one.
# id_column: customer_id

# What you know about a column that the values do not show.
# column_notes:
#   - name: amount
#     description: The loan amount
#     unit: DKK
#     known_issues: 999 was used for 'unknown' before 2021

# Problems you already know about.
# known_issues:
#   - Ages are missing for many rows.

# Groups you especially care about.
# focus_areas:
#   - Customers under 25

# Columns that must not be used, e.g. legally sensitive ones.
# excluded_variables:
#   - gender

# How unclear cleaning cases should be settled, in plain words.
# guidance: >
#   Keep every row unless it is clearly broken. Do not fill in missing values.

# 'decide' (default): the AI settles unclear cleaning cases and the report shows each one.
# 'ask': the run waits for you to settle them in the run's edit/decisions.yaml.
# judgment_calls: decide

# Things you believe about the data; the run checks them. Kinds: column_unique,
# column_not_null, binary_column, value_range, date_range, row_count, allowed_values.
# claims:
#   - kind: column_unique
#     column: customer_id
#     text: customer_id is unique

# For an Excel file: which sheet (default: the first one).
# sheet: Sheet1
